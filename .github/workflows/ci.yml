name: CI

on:
  push:
    branches:
      - main
      - refactor/boardsight-core
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:harmony-resources
      - run: npm run check:chess-parity
      - run: npm run build
      - run: npm run lint
